[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "checker"
path = "src/bin/checker.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
humantime-serde = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
tokio = { version = "1.54.1", features = ["full"] }
