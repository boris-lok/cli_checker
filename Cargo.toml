[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "checker"
path = "src/bin/checker.rs"


[[bin]]
name = "poll"
path = "src/bin/poll.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
humantime-serde = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
tokio = { version = "1.54.1", features = ["full"] }
regex = "1.13.1"
uuid = { version = "1.29.2", features = ["v4"] }
chrono = "0.4.45"
libc = "0.2.191"
sqlx = { version = "0.9.0", features = ["chrono", "sqlite", "runtime-tokio"] }
async-trait = "0.1.92"
humantime = "2.4.0"
